name: Django CI/CD Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest


    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Cache Poetry
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "export PATH=\"$HOME/.local/bin:$PATH\"" >> $GITHUB_ENV

      - name: Install dependencies
        run: poetry install

      - name: Run Flake8
        run: poetry run flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HOST: ${{ secrets.HOST }}
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Cache Poetry
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "export PATH=\"$HOME/.local/bin:$PATH\"" >> $GITHUB_ENV

      - name: Install dependencies
        run: poetry install

      - name: Create .env file
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          echo "DATABASE_DEBUG=${{ secrets.DATABASE_DEBUG }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "HOST=${{ secrets.HOST }}" >> .env
          echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env
          echo "POSTGRES_HOST_AUTH_METHOD=${{ secrets.POSTGRES_HOST_AUTH_METHOD }}" >> .env
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> .env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
          echo "EMAIL_BACKEND=${{ secrets.EMAIL_BACKEND }}" >> .env
          echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}" >> .env
          echo "EMAIL_PORT=${{ secrets.EMAIL_PORT }}" >> .env
          echo "EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}" >> .env
          echo "EMAIL_USE_SSL=${{ secrets.EMAIL_USE_SSL }}" >> .env
          echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}" >> .env
          echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}" >> .env
          echo "CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}" >> .env
          echo "CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}" >> .env

        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_DEBUG: ${{ secrets.DATABASE_DEBUG }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HOST: ${{ secrets.HOST }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_USE_SSL: ${{ secrets.EMAIL_USE_SSL }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
          CELERY_RESULT_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND }}

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U ${{ secrets.POSTGRES_USER }}; do
            sleep 1        
          done

      - name: Run migration
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          HOST: localhost
        run: poetry run python manage.py migrate


      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HOST: localhost
        run: poetry run python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/atomic_habits:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/atomic_habits:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Clean server space
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} \
            "docker system prune -af && sudo apt clean -y"

      - name: Run Docker
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'            
                        
            # 2. Переходим в каталог с репозиторием, если он еще не там  
            cd ${{ secrets.DEPLOY_DIR }} || exit 1 

            # 4. Клонируем репозиторий (если его там нет, или если нужно обновить)
            # Убедитесь, что вы в правильном месте. Если вы уже клонировали,
            # лучше использовать git pull, если это возможно, или сначала удалить старый репо.
            # Для безопасности, будем предполагать, что вы хотите именно клонировать:
            if [ ! -d "atomic_habits" ]; then
              git clone git@github.com:MikhailGubin/atomic_habits.git
              cd ~/atomic_habits || exit 1
            else
              cd ~/atomic_habits || exit 1
              git pull # Обновляем, если уже есть
            fi

            # 5. Теперь, когда мы в каталоге с Dockerfile, мы можем собирать образ
            # ПРОВЕРЬТЕ: Существует ли Dockerfile в /home/***/atomic_habits?
            # Если нет, то вам нужно будет его добавить или изменить способ сборки.
            # Если Dockerfile есть, то эта команда должна работать:
            if [ -f "Dockerfile" ]; then
              echo "Building Docker image..."
              docker build -t atomic_habits:latest . # Собираем образ из текущего каталога
              echo "Image built successfully."
            else
              echo "::error::Dockerfile not found in $(pwd)!"
              exit 1
            fi

            # 6. Проверка, существует ли контейнер. Если нет, то запускаем.
            if ! docker ps -a --filter "name=atomic_habits" | grep -q "atomic_habits"; then
              echo "Container 'atomic_habits' not found. Starting a new one..."
              # Замените command и ports на те, что нужны вашему приложению
              # Важно: Если вы ранее пробрасывали порт 80->8000, используйте это:
              docker run -d --name atomic_habits -p 80:8000 atomic_habits:latest
              # Если вы хотите запускать приложение именно командой "python manage.py runserver"
              # и это было указано в Dockerfile как CMD или ENTRYPOINT, то:
              # docker run -d --name atomic_habits -p 80:8000 atomic_habits:latest python manage.py runserver
            else
              echo "Container 'atomic_habits' already exists. Stopping and removing it to restart..."
              docker stop atomic_habits
              docker rm atomic_habits
              echo "Container removed. Starting a new one..."
              # Повторно запускаем, как выше
              docker run -d --name atomic_habits -p 80:8000 atomic_habits:latest
            fi
          
            echo "Container 'atomic_habits' is running."
          EOF

      - name: Setup Systemd service
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            # Создаем сервисный файл с sudo
            echo "[Unit]
            Description=My Application
            After=network.target
      
            [Service]
            Type=simple
            User=${{ secrets.SSH_USER }}
            WorkingDirectory=/home/${{ secrets.SSH_USER }}/atomic_habits
            ExecStart=/usr/bin/docker compose -f /home/${{ secrets.SSH_USER }}/atomic_habits/docker-compose.yml up
            Restart=always
      
            [Install]
            WantedBy=multi-user.target" | sudo tee /etc/systemd/system/atomic_habits.service
      
            # Настраиваем права
            sudo chmod 644 /etc/systemd/system/atomic_habits.service
            sudo systemctl daemon-reload
            sudo systemctl enable atomic_habits.service
          EOF

      - name: Restart application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            
            docker compose -f ~/atomic_habits/docker-compose.yml down || true
            sudo systemctl start atomic_habits.service          
          EOF

      - name: Verify deployment
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          if ! curl -sSf http://${{ secrets.SERVER_IP }} >/dev/null; then
            echo "::error::App is not running! Checking logs..."
            ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} \
              "sudo docker ps -a && sudo docker logs atomic_habits"
            exit 1
          fi
